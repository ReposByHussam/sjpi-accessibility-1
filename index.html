<!-- 
The A11Y Project är ett community-drivet initiativ som strävar efter att göra digital tillgänglighet enklare, 
mer begriplig och lättare att implementera för alla.

Läs lite om projektet:
https://www.a11yproject.com/about/


Tillgänglighet är en viktig del av webbutveckling. Det handlar om att göra webbplatser och appar tillgängliga för alla, inklusive personer med funktionsnedsättningar. 
Det finns många sätt att göra en webbplats mer tillgänglig, till exempel att använda semantisk HTML, skapa enkel navigering och använda alternativa texter för bilder.
 ____________________________________________________________________________________________________
 1. Läs noga genom koden och identifiera alla tillgänglighetsproblem.
 
 2. Testa kör lighthouse i devtools(Google chrome) och se vilka problem som finns.

 3. Skriv en kort sammanfattning av vad som är fel och hur det kan åtgärdas.

 4. Skriv om koden så att den följer tillgänglighetsstandarder.

 5. Skriv en kort sammanfattning av vad du har ändrat och varför.

 6. Testa din nya kod med andra verktyg för tillgänglighet.

 7. Skriv en kort reflektion över hur det var att göra uppgiften. Vad var svårt? Vad lärde du dig?
 ____________________________________________________________________________________________________

-->

<!doctype html>
<!-- Vad händer när man kommenterar bort språket? -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!-- Endast en `<title>` används; flera kan orsaka oväntat beteende och påverka SEO samt tillgänglighet negativt. -->
    <title>A11y News</title>
  </head>

  <body>
    <!-- Navigeringsmeny med dubblett-ID:n, inkonsekvent tabindex, och brutna länkar till en 404-sida. -->
    <header class="header">
      <div class="wrapper header-inner">
        <div>
          <p class="eyebrow">Accessibility news-site!</p>
          <h1 class="site-title">A11y News</h1>
          <p class="site-intro">Your source for accessible news</p>
        </div>
        <form class="search-form" role="search" aria-label="search on the page">
          <label for="site-search">Search for articles</label>
          <div class="search-row">
            <input
              type="search"
              id="site-search"
              name="q"
              placeholder="Search articles..."
            />
            <button type="submit">Search</button>
          </div>
        </form>
      </div>

      <nav class="primary-nav" aria-label="primary-navigation">
        <div class="wrapper nav-list">
          <a href="#top-news">Home</a>
          <a href="#world-news">World</a>
          <a href="#science-news">Science</a>
          <a href="#culture-news">Culture</a>
        </div>
      </nav>
    </header>
    <!-- Svåråtkomligt inputfällt -->
    <div class="input-container">
      <input type="text" placeholder="Enter text" />
      <button><a href="#">Search</a></button>
    </div>

 

      <!-- Klicka på artikeln för att visa ett meddelande, men den utför egentligen inget. -->
      <div class="article" onclick="alert('This does nothing!')">
        <div>Lunar New Year: Celebrate with us!</div>

        <!-- Bilder visas inte, varför? -->
        <div class="image-container">
          <img src="/images/ocean.jpg" />
          <img src="/images/city.jpg" />
          <img src="/images/family.jpg" />
        </div>

        <p>Access the news by pressing the images</p>
      </div>

      <!-- Allt för stor bild. För att motverka prestanda problem, ha koll på storleken på bilden -->
      <div class="article" style="display: none">
        <p class="headline">Se en 50MB bild ladda långsamt!</p>
        <img
          src="http://upload.wikimedia.org/wikipedia/commons/3/3f/JPEG_example_flower.jpg"
          width="50000"
        />
      </div>

      <!-- Videor kräver mycket prestanda, kan vi ändra eller ta bort för att åstakomma bättre resultat -->
      <div class="article">
        <video
          autoplay
          muted
          loop
          src="https://www.w3schools.com/html/mov_bbb.mp4"
        ></video>
        <img src="http://media.giphy.com/media/xT9IgG50Fb7Mi0prBC/giphy.gif" />
      </div>
    </div>

    <!-- En irriterande annons som alltid syns och innehåller en snurrande bild samt en vilseledande text -->
    <div id="fake-ad">
      <div class="top-section">
        <div class="image-container">
          <img class="rotating-image" src="images/chest.png" />
        </div>
        <p>🎉 You have won $10,000! 🎉</p>
        <div class="image-container">
          <img class="rotating-image" src="images/chest.png" />
        </div>
      </div>
      <p class="btext">Click here to collect your money!</p>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
